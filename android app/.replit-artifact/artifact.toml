kind = "mobile"
previewPath = "/"
title = "Bharat Apadha Prabandham"
description = "An offline-first disaster management companion for citizens in India with government alerts, AI safety guidance, community messaging, translation, weather, and emergency maps."
version = "1.0.0"
id = "artifacts/bharat-apadha-prabandham"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 19095

[services.development]
run = "pnpm --filter @workspace/bharat-apadha-prabandham run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/bharat-apadha-prabandham", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/bharat-apadha-prabandham", "run", "serve" ]

[services.env]
PORT = "19095"
BASE_PATH = "/"
